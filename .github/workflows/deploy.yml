name: 🚀 Deploy DealHunter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy DealHunter
    runs-on: self-hosted

    steps:
      - name: 🔄 Sync & Deploy
        run: |
          set -e

          cd ~/dealhunter-dev
          echo "📥 Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          echo "📦 Building & deploying containers..."
          # Retry up to 3 times in case of transient Docker Hub network errors
          for attempt in 1 2 3; do
            if docker compose up -d --build; then
              echo "✅ Build succeeded on attempt $attempt"
              break
            else
              echo "⚠️ Build failed on attempt $attempt, retrying in 15s..."
              sleep 15
            fi
          done

          docker compose ps
          echo "🎉 Deployment complete!"
