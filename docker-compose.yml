services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dealhunter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dealhunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dealhunter_secret_pass}
      POSTGRES_DB: ${DB_NAME:-dealhunter}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dealhunter} -d ${DB_NAME:-dealhunter}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default: {}

  # -------------------------------------------------------------
  # MinIO Object Storage Service (S3-compatible)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: dealhunter-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dealhunter}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dealhunter_minio_secret}
      TZ: Asia/Jakarta
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    ports:
      - "9001:9001"  # MinIO web console (akses via http://server:9001)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      default: {}
      edge:
        aliases:
          - dealhunter-minio

  # -------------------------------------------------------------
  # Go Fiber Backend API Service (with Rod Scraper)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealhunter-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dealhunter}
      DB_PASSWORD: ${DB_PASSWORD:-dealhunter_secret_pass}
      DB_NAME: ${DB_NAME:-dealhunter}
      DB_SSLMODE: disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dealhunter}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dealhunter_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-dealhunter}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://minio.ramadhaninursarjito.tech}
      TZ: Asia/Jakarta
    expose:
      - "8080"
    networks:
      default: {}
      edge:
        aliases:
          - dealhunter-backend

  # -------------------------------------------------------------
  # Next.js 16 Frontend Web App (Standalone YouTube UI)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dealhunter-api.ramadhaninursarjito.tech/api/v1}
    container_name: dealhunter-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      default: {}
      edge:
        aliases:
          - dealhunter-frontend

# -------------------------------------------------------------
# Persistent Volumes & Network (Connected to EDGE Stack)
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    driver: bridge
  edge:
    external: true
