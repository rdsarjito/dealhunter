name: 🚀 Deploy DealHunter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy DealHunter
    runs-on: self-hosted

    steps:
      - name: 🔄 Sync & Deploy
        run: |
          set -e

          cd ~/dealhunter-dev
          echo "📥 Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          echo "📦 Building & deploying containers with --force-recreate..."
          SUCCESS=0
          for attempt in 1 2 3; do
            if docker compose up -d --build --force-recreate; then
              echo "✅ Build succeeded on attempt $attempt"
              SUCCESS=1
              break
            else
              echo "⚠️ Build failed on attempt $attempt, retrying in 10s..."
              sleep 10
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Docker Compose Build failed after 3 attempts!"
            exit 1
          fi

          docker compose ps
          echo "🎉 Deployment complete!"
