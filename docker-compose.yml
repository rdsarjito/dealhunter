services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dealhunter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dealhunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dealhunter_secret_pass}
      POSTGRES_DB: ${DB_NAME:-dealhunter}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dealhunter} -d ${DB_NAME:-dealhunter}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default: {}

  # -------------------------------------------------------------
  # Go Fiber Backend API Service (with Rod Scraper)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealhunter-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dealhunter}
      DB_PASSWORD: ${DB_PASSWORD:-dealhunter_secret_pass}
      DB_NAME: ${DB_NAME:-dealhunter}
      DB_SSLMODE: disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TZ: Asia/Jakarta
    expose:
      - "8080"
    networks:
      default: {}
      edge:
        aliases:
          - dealhunter-backend

  # -------------------------------------------------------------
  # Next.js 16 Frontend Web App (Standalone YouTube UI)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dealhunter-api.ramadhaninursarjito.tech/api/v1}
    container_name: dealhunter-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      default: {}
      edge:
        aliases:
          - dealhunter-frontend

# -------------------------------------------------------------
# Persistent Volumes & Network (Connected to EDGE Stack)
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  default:
    driver: bridge
  edge:
    external: true
